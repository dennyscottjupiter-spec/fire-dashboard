<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FIRE Dashboard — Tests</title>
  <style>
    body { font-family: ui-monospace, "SF Mono", monospace; background: #1a1a1b; color: #f0f0f0; padding: 28px; font-size: 13px; line-height: 1.6; }
    h1   { color: #0ea5e9; margin-bottom: 4px; font-size: 18px; }
    p    { color: #8a8a8a; margin: 0 0 20px; font-size: 12px; }
    h2   { color: #8a8a8a; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin: 20px 0 6px; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 14px; }
    .pass { color: #22d3a0; }
    .fail { color: #f43f5e; }
    #summary { margin-top: 24px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>
<h1>🔬 FIRE Dashboard — Test Suite</h1>
<p>Open this file in a browser. Engine tests run synchronously; integration tests load index.html in a hidden iframe.</p>
<pre id="out"></pre>
<div id="summary">⏳ Running tests…</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const out = document.getElementById('out');
let pass = 0, fail = 0;
let _done = false;

/* ── harness helpers ──────────────────────────────────────── */
function assert(label, ok, got, expected) {
  if (ok) {
    pass++;
    out.innerHTML += `<span class="pass">✅</span>  ${label}\n`;
  } else {
    fail++;
    out.innerHTML += `<span class="fail">❌</span>  ${label}\n       got      : ${JSON.stringify(got)}\n       expected : ${JSON.stringify(expected)}\n`;
  }
}
function group(name) { out.innerHTML += `\n<b style="color:#8a8a8a">${name}</b>\n`; }
function near(a, b, eps = 0.01) { return Math.abs(a - b) <= eps; }

function renderSummary() {
  if (_done) return;
  _done = true;
  const total = pass + fail;
  document.getElementById('summary').innerHTML =
    `${total} tests — <span class="pass">${pass} passed</span>` +
    (fail > 0 ? `, <span class="fail">${fail} failed</span>` : ' — all green 🎉');
}

/* global error/rejection → count as failed test, always resolve */
window.addEventListener('error', ev => {
  fail++;
  out.innerHTML += `<span class="fail">❌</span>  [uncaught error] ${ev.message} (${ev.filename}:${ev.lineno})\n`;
});
window.addEventListener('unhandledrejection', ev => {
  fail++;
  out.innerHTML += `<span class="fail">❌</span>  [unhandled rejection] ${String(ev.reason)}\n`;
});

/* watchdog: if integration never finishes, force renderSummary after 45 s.
   The suite has grown to 250+ tests with many deliberate async waits (Monte Carlo
   debounce, FileReader imports, reset flush) — 45 s leaves headroom on slow machines
   while still catching a genuine hang. */
const _watchdog = setTimeout(() => {
  fail++;
  out.innerHTML += `<span class="fail">❌</span>  [watchdog] Integration tests did not complete within 45 s\n`;
  renderSummary();
}, 45000);

/* ══════════════════════════════════════════════════════════
   ENGINE UNIT TESTS  (synchronous — run immediately)
   ══════════════════════════════════════════════════════════ */

/* ── parseNum ──────────────────────────────────────────────── */
group('parseNum');
assert('parseNum("50,000")',     parseNum('50,000')    === 50000,   parseNum('50,000'),    50000);
assert('parseNum("1,234,567")', parseNum('1,234,567') === 1234567, parseNum('1,234,567'), 1234567);
assert('parseNum("")',          parseNum('')          === 0,       parseNum(''),          0);
assert('parseNum("abc")',       parseNum('abc')       === 0,       parseNum('abc'),       0);
assert('parseNum("100")',       parseNum('100')       === 100,     parseNum('100'),       100);
assert('parseNum("€50,000")',   parseNum('€50,000')   === 50000,   parseNum('€50,000'),   50000);
assert('parseNum("  50 000 ")  — spaces stripped', parseNum('  50 000 ') === 50000, parseNum('  50 000 '), 50000);
assert('parseNum("0")',         parseNum('0')         === 0,       parseNum('0'),         0);
assert('parseNum("007")',       parseNum('007')       === 7,       parseNum('007'),       7);
assert('parseNum("9999999")',   parseNum('9999999')   === 9999999, parseNum('9999999'),   9999999);

/* ── box3Tax (NL 2026) ─────────────────────────────────────── */
group('box3Tax — NL 2026 proportional method');
assert('no tax below allowance (€50k < €59,357)', box3Tax(50000, 0, 0.02, false) === 0, box3Tax(50000, 0, 0.02, false), 0);
assert('no tax exactly at allowance (€59,357)', box3Tax(59357, 0, 0.02, false) === 0, box3Tax(59357, 0, 0.02, false), 0);
// 100% invest, P=100k: deemed=100k×6.0%=6000; taxableShare=(100k-59357)/100k=0.40643; tax=0.36×6000×0.40643
const expected3 = 0.36 * (100000 * 1.0 * 0.060) * ((100000 - 59357) / 100000);
assert('tax above allowance, 100% invest (t=0)', near(box3Tax(100000, 0, 0.02, false, 100), expected3, 0.1), box3Tax(100000, 0, 0.02, false, 100).toFixed(2), expected3.toFixed(2));
// 100% savings, same P: deemed=100k×1.28%=1280 — much less than invest
const expected3sav = 0.36 * (100000 * 1.0 * 0.0128) * ((100000 - 59357) / 100000);
assert('100% savings pays less tax than 100% invest', expected3sav < expected3, expected3sav.toFixed(2), '< ' + expected3.toFixed(2));
assert('100% savings tax is non-negative', expected3sav >= 0, expected3sav >= 0, true);
const box3Real = box3Tax(100000, 5, 0.02, true, 100);
const box3Nom  = box3Tax(100000, 5, 0.02, false, 100);
assert('real-mode allowance deflates → larger tax than nominal at t=5', box3Real > box3Nom, box3Real.toFixed(4), '> ' + box3Nom.toFixed(4));
assert('real-mode at t=0 equals nominal', near(box3Tax(100000, 0, 0.02, true, 100), box3Tax(100000, 0, 0.02, false, 100), 0.001), true, true);
assert('box3Tax result is non-negative for P=0', box3Tax(0, 0, 0.02, false) === 0, box3Tax(0, 0, 0.02, false), 0);
// backward-compat: omitting allocInvest defaults to 100% invest
assert('omitting allocInvest defaults to 100% invest', near(box3Tax(100000, 0, 0.02, false), box3Tax(100000, 0, 0.02, false, 100), 0.001), true, true);

/* ── customTax ─────────────────────────────────────────────── */
group('customTax');
assert('customTax(1000, 20) = 200',       near(customTax(1000, 20), 200),   customTax(1000, 20),   200);
assert('customTax(1000, 0) = 0',          customTax(1000, 0) === 0,         customTax(1000, 0),    0);
assert('customTax(-500, 20) = 0 (neg gain)', customTax(-500, 20) === 0,     customTax(-500, 20),   0);
assert('customTax(0, 20) = 0',            customTax(0, 20) === 0,           customTax(0, 20),      0);
assert('customTax(500, 100) = 500',       near(customTax(500, 100), 500),   customTax(500, 100),   500);

/* ── runProjection — basic nominal ────────────────────────── */
group('runProjection — nominal, no tax');
const s1 = { portfolio: 50000, income: 60000, spending: 30000, returnRate: 7, inflation: 2, withdrawal: 4, mode: 'nominal', taxMode: 'none' };
const r1 = runProjection(s1);
assert('FI target = spending / (wr/100)',  near(r1.fiTarget, 750000),   r1.fiTarget,   750000);
assert('savings = income − spending',      r1.savings === 30000,         r1.savings,    30000);
assert('savingsRate = 50%',               near(r1.savingsRate, 50),     r1.savingsRate, 50);
assert('yearsToFI is finite and > 0',     r1.yearsToFI > 0,            r1.yearsToFI,  '>0');
assert('data length = 66 (age 30→95 lifecycle horizon)', r1.data.length === 66, r1.data.length, 66);
assert('yr-0 portfolio = initial',        r1.data[0].portfolio === 50000, r1.data[0].portfolio, 50000);
assert('yr-0 age = currentAge default 30', r1.data[0].age === 30,        r1.data[0].age, 30);

/* ── runProjection — already FI ──────────────────────────── */
group('runProjection — already FI');
const r2 = runProjection({ ...s1, portfolio: 800000 });
assert('yearsToFI === 0 when already FI',  r2.yearsToFI === 0, r2.yearsToFI, 0);
assert('unattainable is false when already FI', r2.unattainable === false, r2.unattainable, false);

/* ── runProjection — exactly at FI ───────────────────────── */
group('runProjection — portfolio exactly equals FI target');
const rExact = runProjection({ ...s1, portfolio: 750000 });
assert('portfolio===fiTarget → yearsToFI===0', rExact.yearsToFI === 0, rExact.yearsToFI, 0);

/* ── runProjection — unattainable ────────────────────────── */
group('runProjection — unattainable (spending > income)');
const r3 = runProjection({ ...s1, income: 20000 });
assert('unattainable flag is true',  r3.unattainable === true, r3.unattainable, true);
assert('yearsToFI is null',          r3.yearsToFI === null,    r3.yearsToFI,    null);

/* ── runProjection — zero spending ───────────────────────── */
group('runProjection — spending = 0 (FI already)');
const rZeroSpend = runProjection({ ...s1, spending: 0 });
assert('spending=0 → fiTarget=0 → already FI', rZeroSpend.yearsToFI === 0, rZeroSpend.yearsToFI, 0);

/* ── runProjection — withdrawal = 0 ─────────────────────── */
group('runProjection — withdrawal rate = 0 (Infinity FI)');
const rZeroWR = runProjection({ ...s1, withdrawal: 0 });
assert('withdrawal=0 → fiTarget=Infinity', !isFinite(rZeroWR.fiTarget), rZeroWR.fiTarget, Infinity);
assert('withdrawal=0 → yearsToFI=null (never)',  rZeroWR.yearsToFI === null, rZeroWR.yearsToFI, null);

/* ── runProjection — zero income ─────────────────────────── */
group('runProjection — income = 0');
const rZeroIncome = runProjection({ ...s1, income: 0, spending: 0 });
assert('income=0 spending=0 → savingsRate=0', rZeroIncome.savingsRate === 0, rZeroIncome.savingsRate, 0);

/* ── runProjection — Real mode ───────────────────────────── */
// Compared during accumulation (yr-10, pre-FI) where the deflated-contributions
// semantic is clean; post-retirement contributions stop, so the property is age-scoped.
group('runProjection — Real mode vs Nominal (deflated contributions)');
const r4nom = runProjection({ ...s1, mode: 'nominal' });
const r4rl  = runProjection({ ...s1, mode: 'real' });
assert('Real yr-10 portfolio < Nominal yr-10 (deflated contributions)',
  r4rl.data[10].portfolio < r4nom.data[10].portfolio,
  Math.round(r4rl.data[10].portfolio), '< ' + Math.round(r4nom.data[10].portfolio));
assert('Real yr-10 portfolio is finite and positive',
  Number.isFinite(r4rl.data[10].portfolio) && r4rl.data[10].portfolio > 0,
  r4rl.data[10].portfolio.toFixed(0), '>0');

/* ── runProjection — high inflation real mode stays finite ── */
group('runProjection — high inflation real mode stays finite and ≥ 0');
const rHighInfl = runProjection({ ...s1, inflation: 8, returnRate: 5, mode: 'real' });
assert('high-inflation real mode yr-50 is finite', Number.isFinite(rHighInfl.data[50].portfolio), true, true);
assert('high-inflation real mode yr-50 is ≥ 0', rHighInfl.data[50].portfolio >= 0, true, true);

/* ── runProjection — Box-3 tax drag ──────────────────────── */
group('runProjection — Box-3 tax slows growth');
const r5notax = runProjection({ ...s1, taxMode: 'none' });
const r5box3  = runProjection({ ...s1, taxMode: 'box3' });
assert('Box-3 yr-20 portfolio < no-tax yr-20',
  r5box3.data[20].portfolio < r5notax.data[20].portfolio,
  Math.round(r5box3.data[20].portfolio), '< ' + Math.round(r5notax.data[20].portfolio));

/* ── runProjection — Box-3 real mode ─────────────────────── */
group('runProjection — Box-3 in real mode');
const r5box3Real = runProjection({ ...s1, taxMode: 'box3', mode: 'real' });
assert('Box-3 real yr-20 portfolio < no-tax nominal yr-20',
  r5box3Real.data[20].portfolio < r5notax.data[20].portfolio, true, true);
assert('Box-3 real yr-20 is finite and > 0',
  Number.isFinite(r5box3Real.data[20].portfolio) && r5box3Real.data[20].portfolio > 0, true, true);

/* ── runProjection — Custom tax ──────────────────────────── */
group('runProjection — Custom tax');
const r6custom = runProjection({ ...s1, taxMode: 'custom', taxCustomPct: 20 });
assert('Custom-20% yr-20 portfolio < no-tax yr-20',
  r6custom.data[20].portfolio < r5notax.data[20].portfolio,
  Math.round(r6custom.data[20].portfolio), '< ' + Math.round(r5notax.data[20].portfolio));

/* ── runProjection — Custom tax real mode ─────────────────── */
// Compared at yr-10 (pre-FI): both real scenarios are still accumulating, so the
// tax purely subtracts. Post-FI the taxed run retires a year or two later, and the
// retirement-crossover timing can invert a same-year comparison.
group('runProjection — Custom tax in real mode');
const r6customReal = runProjection({ ...s1, taxMode: 'custom', taxCustomPct: 20, mode: 'real' });
assert('Custom-20% real yr-10 < no-tax real yr-10',
  r6customReal.data[10].portfolio < r4rl.data[10].portfolio,
  Math.round(r6customReal.data[10].portfolio), '< ' + Math.round(r4rl.data[10].portfolio));

/* ── Lifecycle — decumulation & depletion ────────────────── */
group('runProjection — lifecycle decumulation & depleteAge');
// Already-FI overspender: 20% WR depletes the pot before the horizon.
const rDeplete = runProjection({ portfolio: 500000, income: 0, spending: 100000,
  returnRate: 3, inflation: 2, withdrawal: 20, mode: 'nominal', taxMode: 'none', currentAge: 50 });
assert('overspending retiree retires at t=0', rDeplete.yearsToFI === 0, rDeplete.yearsToFI, 0);
assert('depleteAge is set when pot runs dry', rDeplete.depleteAge !== null, rDeplete.depleteAge, '!= null');
assert('depleteAge within horizon (≤ 95)', rDeplete.depleteAge <= 95, rDeplete.depleteAge, '≤ 95');
// Sustainable retiree: 2% effective WR never depletes.
const rSustain = runProjection({ portfolio: 2000000, income: 0, spending: 40000,
  returnRate: 7, inflation: 2, withdrawal: 4, mode: 'nominal', taxMode: 'none', currentAge: 50 });
assert('sustainable retiree never depletes (depleteAge null)', rSustain.depleteAge === null, rSustain.depleteAge, null);
assert('final data point reaches longevity age 95', rSustain.data[rSustain.data.length - 1].age === 95, rSustain.data[rSustain.data.length - 1].age, 95);
assert('retirement year is phase "draw"', rSustain.data[1].phase === 'draw', rSustain.data[1].phase, 'draw');

/* ── Lifecycle — TER fee-drag mechanism ──────────────────── */
// The TER subtraction lives in app.js (returnRate − terPct); here we verify the
// engine responds monotonically: a lower net return yields lower terminal wealth.
group('runProjection — fee drag (lower net return → less wealth)');
const rNoFee  = runProjection({ ...s1, returnRate: 7.0 });
const rWithFee = runProjection({ ...s1, returnRate: 6.8 }); // 0.2% TER shaved off
assert('0.2% fee drag lowers yr-10 portfolio', rWithFee.data[10].portfolio < rNoFee.data[10].portfolio,
  Math.round(rWithFee.data[10].portfolio), '< ' + Math.round(rNoFee.data[10].portfolio));

/* ── Lifecycle — pension/AOW bridge ──────────────────────── */
group('runProjection — pension bridge reduces post-age withdrawals');
const pensBase = { portfolio: 1000000, income: 0, spending: 50000, returnRate: 5,
  inflation: 2, withdrawal: 5, mode: 'nominal', taxMode: 'none', currentAge: 60, pensionAge: 67 };
const rNoPens = runProjection({ ...pensBase, pensionAmount: 0 });
const rPens   = runProjection({ ...pensBase, pensionAmount: 30000 });
assert('pension income lifts terminal wealth',
  rPens.data[rPens.data.length - 1].portfolio > rNoPens.data[rNoPens.data.length - 1].portfolio,
  Math.round(rPens.data[rPens.data.length - 1].portfolio), '> ' + Math.round(rNoPens.data[rNoPens.data.length - 1].portfolio));
assert('no difference before pension age (age 65, t=5)',
  near(rPens.data[5].portfolio, rNoPens.data[5].portfolio, 1),
  Math.round(rPens.data[5].portfolio), Math.round(rNoPens.data[5].portfolio));

/* ── Lifecycle — lumpy life events ───────────────────────── */
group('runProjection — lumpy life events shift the pot');
const evBase  = { ...s1, currentAge: 30 };
const rInherit = runProjection({ ...evBase, events: [{ age: 35, amount: 100000 }] });
const rBaseEv  = runProjection(evBase);
// age 35 = t=5; event lands before growth so it contributes >€100k that year
assert('€100k inheritance at age 35 raises that year by > €100k',
  rInherit.data[5].portfolio - rBaseEv.data[5].portfolio > 100000,
  Math.round(rInherit.data[5].portfolio - rBaseEv.data[5].portfolio), '> 100000');
const rOutlay = runProjection({ ...evBase, events: [{ age: 35, amount: -50000 }] });
assert('−€50k outlay at age 35 lowers that year',
  rOutlay.data[5].portfolio < rBaseEv.data[5].portfolio,
  Math.round(rOutlay.data[5].portfolio), '< ' + Math.round(rBaseEv.data[5].portfolio));

/* ── coastFiTarget ───────────────────────────────────────── */
group('coastFiTarget');
const fi = 750000, realReturn = 0.05;
const coast30 = coastFiTarget(fi, 30, realReturn);
const coast65 = coastFiTarget(fi, 65, realReturn);
assert('Coast FI at age 30 < Full FI',           coast30 < fi,                       coast30.toFixed(0), '< ' + fi);
assert('Coast FI at age 65 === Full FI',          near(coast65, fi, 1),               coast65.toFixed(0), fi);
assert('Coast FI at age 64 slightly < Full FI',   coastFiTarget(fi, 64, realReturn) < fi, '< fi', fi);
assert('Coast FI at age > 65 returns fi',         coastFiTarget(fi, 70, realReturn) === fi, coastFiTarget(fi, 70, realReturn), fi);
assert('Coast FI with realReturn=0 returns fi',   coastFiTarget(fi, 30, 0) === fi,    coastFiTarget(fi, 30, 0), fi);
assert('Coast FI with negativeReturn > fi',       coastFiTarget(fi, 30, -0.01) > fi, coastFiTarget(fi, 30, -0.01).toFixed(0), '> ' + fi);

/* ── Risk engine: RNG, Monte Carlo, historical, strategies (v1.8) ── */
group('data.js — historical dataset');
assert('HIST spans ~a century (≥ 95 years)', HIST.length >= 95, HIST.length, '≥95');
assert('HIST rows have ret + infl numbers', typeof HIST[0].ret === 'number' && typeof HIST[0].infl === 'number', true, true);
assert('1931 is a deep crash year (< −40%)', HIST.find(h => h.year === 1931).ret < -0.4, HIST.find(h => h.year === 1931).ret, '< -0.4');
assert('2008 crash present (< −30%)', HIST.find(h => h.year === 2008).ret < -0.3, HIST.find(h => h.year === 2008).ret, '< -0.3');

group('mulberry32 RNG — deterministic');
assert('same seed → same first draw', mulberry32(42)() === mulberry32(42)(), true, true);
assert('different seeds → different draws', mulberry32(1)() !== mulberry32(2)(), true, true);
(() => { const r = mulberry32(7); let ok = true; for (let i = 0; i < 200; i++) { const x = r(); if (x < 0 || x >= 1) ok = false; } assert('draws stay in [0,1)', ok, true, true); })();

group('runMonteCarlo — reproducible + well-formed');
const mcBase = { ...s1, currentAge: 40 };
const mcA = runMonteCarlo(mcBase, 200, 123);
const mcB = runMonteCarlo(mcBase, 200, 123);
assert('same seed → identical successRate', mcA.successRate === mcB.successRate, mcA.successRate, mcB.successRate);
assert('successRate in [0,1]', mcA.successRate >= 0 && mcA.successRate <= 1, mcA.successRate, '0–1');
assert('bands length = horizon+1 (age 40→95 = 56)', mcA.bands.length === 56, mcA.bands.length, 56);
assert('bands first age = currentAge 40', mcA.bands[0].age === 40, mcA.bands[0].age, 40);
assert('p10 ≤ p50 ≤ p90 at mid-horizon', mcA.bands[20].p10 <= mcA.bands[20].p50 && mcA.bands[20].p50 <= mcA.bands[20].p90, true, true);

group('runMonteCarlo — sensible success rates');
const mcRich  = runMonteCarlo({ portfolio: 3000000, income: 0, spending: 40000, withdrawal: 4, returnRate: 7, inflation: 2, mode: 'nominal', taxMode: 'none', currentAge: 60, allocInvest: 100 }, 300, 7);
assert('over-funded retiree survives almost always (>0.9)', mcRich.successRate > 0.9, mcRich.successRate, '>0.9');
const mcBroke = runMonteCarlo({ portfolio: 500000, income: 0, spending: 80000, withdrawal: 16, returnRate: 7, inflation: 2, mode: 'nominal', taxMode: 'none', currentAge: 60, allocInvest: 100 }, 300, 7);
assert('overspending retiree often fails (<0.6)', mcBroke.successRate < 0.6, mcBroke.successRate, '<0.6');

group('runHistorical — replay specific vintages');
const histBase = { ...s1, currentAge: 40 };
const h2008 = runHistorical(histBase, 2008);
assert('replay returns full data path (56)', h2008.data.length === 56, h2008.data.length, 56);
assert('replay differs from flat projection', h2008.data[10].portfolio !== runProjection(histBase).data[10].portfolio, true, true);
const h1929 = runHistorical({ portfolio: 600000, income: 0, spending: 36000, withdrawal: 6, returnRate: 7, inflation: 2, mode: 'nominal', taxMode: 'none', currentAge: 60, allocInvest: 100 }, 1929);
assert('1929 retirement (thin pot) depletes', h1929.depleteAge !== null, h1929.depleteAge, '!= null');
assert('unknown start year falls back to dataset start (no crash)', runHistorical(histBase, 3000).data.length === 56, runHistorical(histBase, 3000).data.length, 56);

group('withdrawal strategies — VPW & Guyton-Klinger');
const vpw = runProjection({ portfolio: 500000, income: 0, spending: 100000, withdrawal: 20, returnRate: 5, inflation: 2, mode: 'nominal', taxMode: 'none', currentAge: 55, wdStrategy: 'vpw' });
assert('VPW never fully depletes (draws % of pot)', vpw.depleteAge === null, vpw.depleteAge, null);
const gkVint = { portfolio: 1000000, income: 0, spending: 40000, withdrawal: 4, returnRate: 6, inflation: 2, mode: 'nominal', taxMode: 'none', currentAge: 55, allocInvest: 100 };
const gkH = runHistorical({ ...gkVint, wdStrategy: 'gk' },    1966);
const fxH = runHistorical({ ...gkVint, wdStrategy: 'fixed' }, 1966);
assert('GK diverges from fixed under a volatile vintage', gkH.data[20].portfolio !== fxH.data[20].portfolio, true, true);
assert('GK projection stays finite', Number.isFinite(gkH.data[gkH.data.length - 1].portfolio), true, true);

/* ── Box-1 pension pot (v1.9 NL tax layering) ────────────── */
group('box1Tax — progressive post-AOW');
assert('box1Tax(0) = 0', box1Tax(0) === 0, box1Tax(0), 0);
assert('box1Tax(20000) = 20000 × 19.07%', near(box1Tax(20000), 20000 * 0.1907, 0.01), box1Tax(20000).toFixed(2), (20000 * 0.1907).toFixed(2));
const b1exp = 38441 * 0.1907 + (50000 - 38441) * 0.37;
assert('box1Tax(50000) uses both brackets', near(box1Tax(50000), b1exp, 0.01), box1Tax(50000).toFixed(2), b1exp.toFixed(2));
assert('box1Tax is progressive (higher income → higher effective rate)',
  box1Tax(60000) / 60000 > box1Tax(20000) / 20000, true, true);

group('runProjection — Box-1 pension pot');
const potBase = { portfolio: 800000, income: 0, spending: 40000, withdrawal: 5, returnRate: 6, inflation: 2, mode: 'nominal', taxMode: 'none', currentAge: 55, pensionAge: 67, allocInvest: 100 };
const noPot   = runProjection(potBase);
const withPot = runProjection({ ...potBase, pensionPot: 400000 });
assert('pension pot grows before AOW (t=5 > seed)', withPot.data[5].pp > 400000, Math.round(withPot.data[5].pp), '> 400000');
assert('pension pot is 0 after annuitization (t=20)', withPot.data[20].pp === 0, withPot.data[20].pp, 0);
assert('no-pot scenario carries pp = 0', noPot.data[5].pp === 0, noPot.data[5].pp, 0);
assert('taxable pool identical BEFORE AOW (pot is separate)', near(withPot.data[5].portfolio, noPot.data[5].portfolio, 1), Math.round(withPot.data[5].portfolio), Math.round(noPot.data[5].portfolio));
assert('taxable pool HIGHER after AOW (annuity offsets withdrawals)', withPot.data[25].portfolio > noPot.data[25].portfolio, Math.round(withPot.data[25].portfolio), '> ' + Math.round(noPot.data[25].portfolio));

  document.body.appendChild(iframe);

    await Promise.race([
      new Promise(resolve => iframe.addEventListener('load', resolve, { once: true })),

    ]);

    setVal('input-income', '60000'); fireBlur('input-income');
    assert('notice banner hidden after restoring income',
      !doc.getElementById('notice-banner').classList.contains('visible'), true, true);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] notice banner: ${e.message}\n`; }

  /* ── milestones ──────────────────────────────────────────── */
  try {
    group('Integration — milestones achieved / unachieved');
    setVal('input-spending', '30000'); fireBlur('input-spending');
    setVal('val-withdrawal', '4');     fireBlur('val-withdrawal');

    setVal('input-portfolio', '150000'); fireBlur('input-portfolio');
    assert('First €100k milestone achieved at 150k',
      doc.querySelector('[data-milestone="100k"]').classList.contains('achieved'), true, true);
    assert('Barista milestone (375k) NOT achieved at 150k',
      !doc.querySelector('[data-milestone="barista"]').classList.contains('achieved'), true, true);

    setVal('input-portfolio', '750000'); fireBlur('input-portfolio');
    assert('Full FIRE milestone achieved at exactly 750k (FI target)',
      doc.querySelector('[data-milestone="full"]').classList.contains('achieved'), true, true);
    assert('Fat FIRE (1125k) NOT achieved at 750k',
      !doc.querySelector('[data-milestone="fat"]').classList.contains('achieved'), true, true);

    setVal('input-portfolio', '1125000'); fireBlur('input-portfolio');
    assert('Fat FIRE achieved at 1125k (150% × 750k)',
      doc.querySelector('[data-milestone="fat"]').classList.contains('achieved'), true, true);

    /* milestone threshold text is formatted € */
    const fullVal = text('ms-full-val');
    assert('Full FIRE threshold shows € amount', fullVal.includes('€') || fullVal.includes('750'), fullVal, '€750,000');

    setVal('input-portfolio', '50000'); fireBlur('input-portfolio');
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] milestones: ${e.message}\n`; }

  /* ── withdrawal strategy toggle (v1.8) ───────────────────── */
  try {
    group('Integration — withdrawal strategy toggle');
    resetBaseline();
    clickEl('btn-strat-gk');
    assert('strategy = gk after click', s.wdStrategy === 'gk', s.wdStrategy, 'gk');
    assert('gk button gets .active-strat', doc.getElementById('btn-strat-gk').classList.contains('active-strat'), true, true);
    clickEl('btn-strat-vpw');
    assert('strategy = vpw after click', s.wdStrategy === 'vpw', s.wdStrategy, 'vpw');
    assert('fixed button loses .active-strat', !doc.getElementById('btn-strat-fixed').classList.contains('active-strat'), true, true);
    clickEl('btn-strat-fixed');
    assert('strategy back to fixed', s.wdStrategy === 'fixed', s.wdStrategy, 'fixed');
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] strategy toggle: ${e.message}\n`; }

  /* ── projection mode: Monte Carlo (v1.8) ─────────────────── */
  try {
    group('Integration — projection mode: Monte Carlo');
    resetBaseline();
    clickEl('btn-proj-mc');
    assert('projMode = montecarlo', s.projMode === 'montecarlo', s.projMode, 'montecarlo');
    assert('mc-success badge shown', doc.getElementById('mc-success').style.display !== 'none', true, true);
    await new Promise(r => setTimeout(r, 350));   // debounced MC compute (250 ms)
    const succ = text('mc-success-val');
    assert('success readout is a percentage', /^\d+%$/.test(succ), succ, 'N%');
    const pctNum = parseInt(succ, 10);
    assert('success rate within 0–100', pctNum >= 0 && pctNum <= 100, pctNum, '0–100');
    /* MC fan bands populated and ordered */
    const mcChart = win.Chart.getChart('fi-chart');
    assert('median band populated', mcChart.data.datasets[4].data.length > 0, mcChart.data.datasets[4].data.length, '>0');
    assert('p10 ≤ p50 ≤ p90 mid-horizon', mcChart.data.datasets[3].data[20] <= mcChart.data.datasets[4].data[20] && mcChart.data.datasets[4].data[20] <= mcChart.data.datasets[2].data[20], true, true);
    clickEl('btn-proj-steady');
    assert('projMode back to steady', s.projMode === 'steady', s.projMode, 'steady');
    assert('mc-success hidden in steady', doc.getElementById('mc-success').style.display === 'none', true, true);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] Monte Carlo: ${e.message}\n`; }

  /* ── projection mode: History vintage (v1.8) ─────────────── */
  try {
    group('Integration — projection mode: History vintage');
    resetBaseline();
    clickEl('btn-proj-history');
    assert('projMode = history', s.projMode === 'history', s.projMode, 'history');
    assert('vintage select visible', doc.getElementById('vintage-select').style.display !== 'none', true, true);
    const vsel = doc.getElementById('vintage-select');
    vsel.value = '1929';
    vsel.dispatchEvent(new win.Event('change', { bubbles: true }));
    assert('vintageYear = 1929', s.vintageYear === 1929, s.vintageYear, 1929);
    clickEl('btn-proj-steady');
    assert('vintage select hidden in steady', doc.getElementById('vintage-select').style.display === 'none', true, true);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] History vintage: ${e.message}\n`; }

  /* ── TER fund fee (fee drag) ─────────────────────────────── */
  try {
    group('Integration — TER fund fee (fee drag)');
    resetBaseline();
    doc.getElementById('slider-alloc').value = '100';
    doc.getElementById('slider-alloc').dispatchEvent(new win.Event('input', { bubbles: true }));
    setVal('val-return', '7'); fireBlur('val-return');
    setVal('val-ter', '1'); fireBlur('val-ter');
    assert('terPct = 1 accepted', s.terPct === 1, s.terPct, 1);
    assert('net blended return = 6.0 at 100% invest (7 − 1 fee)', near(s.returnRate, 6), s.returnRate, 6);
    assert('blended-return DOM shows net 6.0', text('blended-return') === '6.0', text('blended-return'), '6.0');
    assert('fee-impact readout is non-zero under 1% fee', text('fee-impact-val') !== '€0', text('fee-impact-val'), '!= €0');
    setVal('val-ter', '99'); fireBlur('val-ter');
    assert('TER clamps to cap 5 on blur', s.terPct === 5, s.terPct, 5);
    setVal('val-ter', '0'); fireBlur('val-ter');
    assert('fee-impact = €0 when TER = 0', text('fee-impact-val') === '€0', text('fee-impact-val'), '€0');
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] TER fee: ${e.message}\n`; }

  /* ── pension bridge inputs ───────────────────────────────── */
  try {
    group('Integration — pension bridge inputs');
    resetBaseline();
    setVal('input-pension-age', '65'); fireBlur('input-pension-age');
    assert('pensionAge = 65', s.pensionAge === 65, s.pensionAge, 65);
    setVal('input-pension-amount', '20000'); fireBlur('input-pension-amount');
    assert('pensionAmount = 20000', s.pensionAmount === 20000, s.pensionAmount, 20000);
    assert('pension-amount formats with comma on blur', val('input-pension-amount') === '20,000', val('input-pension-amount'), '20,000');
    setVal('input-pension-amount', '0'); fireBlur('input-pension-amount');
    setVal('input-pension-age', '67'); fireBlur('input-pension-age');
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] pension: ${e.message}\n`; }

  /* ── lifecycle depletion note ────────────────────────────── */
  try {
    group('Integration — lifecycle depletion note');
    resetBaseline();
    setVal('input-portfolio', '500000'); fireBlur('input-portfolio');
    setVal('input-income',    '0');      fireBlur('input-income');
    setVal('input-spending',  '100000'); fireBlur('input-spending');
    setVal('val-withdrawal',  '20');     fireBlur('val-withdrawal');
    assert('depletion note has .dry class', doc.getElementById('lifecycle-note').classList.contains('dry'), true, true);
    assert('depletion note text mentions running dry', text('lifecycle-note').toLowerCase().includes('dry'), text('lifecycle-note'), '~runs dry');
    /* well-funded retiree survives to horizon */
    setVal('input-portfolio', '2000000'); fireBlur('input-portfolio');
    setVal('input-spending',  '40000');   fireBlur('input-spending');
    setVal('val-withdrawal',  '4');       fireBlur('val-withdrawal');
    assert('survival note has .ok class for well-funded retiree', doc.getElementById('lifecycle-note').classList.contains('ok'), true, true);
    resetBaseline();
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] lifecycle note: ${e.message}\n`; }

  /* ── life events manager ─────────────────────────────────── */
  try {
    group('Integration — life events manager');
    resetBaseline();
    const before = s.events.length;
    clickEl('btn-add-event');
    assert('add event → a row appears', doc.querySelectorAll('#events-list .event-row').length === before + 1,
      doc.querySelectorAll('#events-list .event-row').length, before + 1);
    assert('add event → state.events grew', s.events.length === before + 1, s.events.length, before + 1);
    const row = doc.querySelector('#events-list .event-row:last-child');
    const amtInput = row.querySelector('.event-amount');
    amtInput.value = '100000';
    amtInput.dispatchEvent(new win.Event('input', { bubbles: true }));
    assert('event amount recorded in state', s.events[s.events.length - 1].amount === 100000,
      s.events[s.events.length - 1].amount, 100000);
    /* negative outlay parses as negative */
    amtInput.value = '-50000';
    amtInput.dispatchEvent(new win.Event('input', { bubbles: true }));
    assert('negative event amount parses as −50000', s.events[s.events.length - 1].amount === -50000,
      s.events[s.events.length - 1].amount, -50000);
    row.querySelector('.event-remove').click();
    assert('remove event → row gone', doc.querySelectorAll('#events-list .event-row').length === before,
      doc.querySelectorAll('#events-list .event-row').length, before);
    assert('remove event → state.events shrank', s.events.length === before, s.events.length, before);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] life events: ${e.message}\n`; }

  /* ── Box-1 pension pot (v1.9) ────────────────────────────── */
  try {
    group('Integration — Box-1 pension pot');
    resetBaseline();
    const chartOf = () => win.Chart.getChart('fi-chart');
    setVal('input-pension-pot', '300000'); fireBlur('input-pension-pot');
    assert('pensionPot = 300000', s.pensionPot === 300000, s.pensionPot, 300000);
    assert('pension-pot formats with comma on blur', val('input-pension-pot') === '300,000', val('input-pension-pot'), '300,000');
    assert('pension-pot chart line shown when pot > 0', chartOf().data.datasets[5].hidden === false, chartOf().data.datasets[5].hidden, false);
    setVal('input-pension-contrib', '8000'); fireBlur('input-pension-contrib');
    assert('pensionContrib = 8000', s.pensionContrib === 8000, s.pensionContrib, 8000);
    setVal('input-pension-pot', '0');     fireBlur('input-pension-pot');
    setVal('input-pension-contrib', '0'); fireBlur('input-pension-contrib');
    assert('pot line hidden when pot & contrib are 0', chartOf().data.datasets[5].hidden === true, chartOf().data.datasets[5].hidden, true);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] pension pot: ${e.message}\n`; }

  /* ── A/B scenario compare (v2.0) ─────────────────────────── */
  try {
    group('Integration — A/B scenario compare');
    resetBaseline();
    const chartOf = () => win.Chart.getChart('fi-chart');
    clickEl('btn-compare');
    assert('compare on → scenario A datasets shown', chartOf().data.datasets[6].hidden === false, chartOf().data.datasets[6].hidden, false);
    assert('compare readout visible', doc.getElementById('compare-readout').style.display !== 'none', true, true);
    assert('scenario A saved to localStorage', win.localStorage.getItem('fire-dashboard-scenario-a') !== null, true, true);
    setVal('input-income', '120000'); fireBlur('input-income');
    assert('compare readout mentions FIRE years', text('compare-readout').includes('FIRE'), text('compare-readout').slice(0, 12), '~A: FIRE');
    clickEl('btn-compare');  // toggle off
    assert('compare off → A datasets hidden', chartOf().data.datasets[6].hidden === true, chartOf().data.datasets[6].hidden, true);
    assert('compare readout hidden when off', doc.getElementById('compare-readout').style.display === 'none', true, true);
    assert('scenario A cleared from localStorage', win.localStorage.getItem('fire-dashboard-scenario-a') === null, null, null);
    setVal('input-income', '60000'); fireBlur('input-income');
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] A/B compare: ${e.message}\n`; }

  /* ── onboarding wizard (v2.0) ────────────────────────────── */
  try {
    group('Integration — onboarding wizard');
    resetBaseline();
    win.openWizard();
    assert('wizard opens', doc.getElementById('wizard-overlay').style.display === 'flex', doc.getElementById('wizard-overlay').style.display, 'flex');
    assert('wizard shows 5 progress dots', doc.querySelectorAll('#wizard-progress .wiz-dot').length === 5, doc.querySelectorAll('#wizard-progress .wiz-dot').length, 5);
    const wizIn = v => { doc.getElementById('wiz-input').value = String(v); };
    wizIn(45);        clickEl('wizard-next');
    wizIn('100,000'); clickEl('wizard-next');
    wizIn('40,000');  clickEl('wizard-next');
    wizIn(60);        clickEl('wizard-next');
    doc.querySelector('.wiz-choice[data-val="cautious"]').click();
    assert('finish button labelled on last step', doc.getElementById('wizard-next').textContent.includes('Finish'), doc.getElementById('wizard-next').textContent, '~Finish');
    clickEl('wizard-next');   // finish
    await new Promise(r => setTimeout(r, 30));
    assert('wizard applied age 45', s.currentAge === 45, s.currentAge, 45);
    assert('wizard applied income 100000', s.income === 100000, s.income, 100000);
    assert('wizard applied spending 40000', s.spending === 40000, s.spending, 40000);
    assert('wizard retireAge 60 → withdrawal 4%', s.withdrawal === 4, s.withdrawal, 4);
    assert('wizard cautious risk → alloc 40%', s.allocInvest === 40, s.allocInvest, 40);
    assert('wizard closed after finish', doc.getElementById('wizard-overlay').style.display === 'none', true, true);
    /* skip button also closes */
    win.openWizard();
    clickEl('wizard-skip');
    assert('skip closes the wizard', doc.getElementById('wizard-overlay').style.display === 'none', true, true);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] wizard: ${e.message}\n`; }

  /* ── import guards ───────────────────────────────────────── */
  try {
    group('Integration — import size / type guards');
    const portfolioBefore = s.portfolio;

    win.importConfig(new File(['x'.repeat(102401)], 'big.json', { type: 'application/json' }));
    assert('size guard: state unchanged after >100 KB file', s.portfolio === portfolioBefore, s.portfolio, portfolioBefore);

    win.importConfig(new File(['{}'], 'bad.txt', { type: 'text/plain' }));
    assert('type guard: state unchanged after wrong-type file', s.portfolio === portfolioBefore, s.portfolio, portfolioBefore);

    /* invalid JSON content */
    win.importConfig(new File(['not valid json {{'], 'fire.json', { type: 'application/json' }));
    await new Promise(r => setTimeout(r, 150));
    assert('invalid-JSON import: state unchanged', s.portfolio === portfolioBefore, s.portfolio, portfolioBefore);

    /* valid import */
    const validCfg = JSON.stringify({ portfolio: 123456, income: 80000, spending: 25000 });
    win.importConfig(new File([validCfg], 'fire.json', { type: 'application/json' }));
    await new Promise(r => setTimeout(r, 150));
    assert('valid import applies new portfolio value', s.portfolio === 123456, s.portfolio, 123456);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] import guards: ${e.message}\n`; }

  /* ── backward-compat import (old returnRate key) ─────────── */
  try {
    group('Integration — backward-compat import (old returnRate key)');
    const oldCfg = JSON.stringify({ portfolio: 90000, returnRate: 8 });
    win.importConfig(new File([oldCfg], 'fire.json', { type: 'application/json' }));
    await new Promise(r => setTimeout(r, 150));
    assert('old config: portfolio applied', s.portfolio === 90000, s.portfolio, 90000);
    assert('old config: investReturn set to 8 (from returnRate)', s.investReturn === 8, s.investReturn, 8);
    assert('old config: allocInvest forced to 100', s.allocInvest === 100, s.allocInvest, 100);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] backward-compat import: ${e.message}\n`; }

  /* ── split-return state fields ───────────────────────────── */
  try {
    group('Integration — split-return state fields');
    resetBaseline();
    assert('state.investReturn is a number',  typeof s.investReturn  === 'number', typeof s.investReturn,  'number');
    assert('state.savingsReturn is a number', typeof s.savingsReturn === 'number', typeof s.savingsReturn, 'number');
    assert('state.allocInvest is a number',   typeof s.allocInvest   === 'number', typeof s.allocInvest,   'number');
    const expectedBlend = s.allocInvest / 100 * s.investReturn + (1 - s.allocInvest / 100) * s.savingsReturn;
    assert('state.returnRate equals blend formula', near(s.returnRate, expectedBlend, 0.001), s.returnRate, expectedBlend);
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] split-return: ${e.message}\n`; }

  /* ── localStorage persistence round-trip ─────────────────── */
  try {
    group('Integration — localStorage persistence round-trip');
    resetBaseline();
    setVal('input-portfolio', '88888'); fireBlur('input-portfolio');
    /* saveState() fires on every recalc — check LS now */
    const stored = JSON.parse(win.localStorage.getItem(win._LS_KEY || 'fire-dashboard-state') || '{}');
    assert('portfolio 88888 persisted to localStorage', stored.portfolio === 88888, stored.portfolio, 88888);
    assert('inflation persisted to localStorage', stored.inflation === s.inflation, stored.inflation, s.inflation);
    assert('terPct persisted to localStorage', stored.terPct === s.terPct, stored.terPct, s.terPct);
    assert('pensionAge persisted to localStorage', stored.pensionAge === s.pensionAge, stored.pensionAge, s.pensionAge);
    assert('wdStrategy persisted to localStorage', stored.wdStrategy === s.wdStrategy, stored.wdStrategy, s.wdStrategy);
    assert('projMode persisted to localStorage', stored.projMode === s.projMode, stored.projMode, s.projMode);
    assert('pensionPot persisted to localStorage', stored.pensionPot === s.pensionPot, stored.pensionPot, s.pensionPot);
    setVal('input-portfolio', '50000'); fireBlur('input-portfolio');
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] localStorage round-trip: ${e.message}\n`; }

  /* ── Reset button (two-step confirm) ─────────────────────── */
  try {
    group('Integration — Reset saved data button (two-step confirm)');
    // Flush any pending FileReader onload from the import tests above: a late
    // callback fires recalc()→saveState() and would re-write the LS key right
    // after reset removes it. Draining here keeps the LS-null assertion stable.
    await new Promise(r => setTimeout(r, 250));
    resetBaseline();
    setVal('input-portfolio', '99999'); fireBlur('input-portfolio');
    const lsKey = win._LS_KEY || 'fire-dashboard-state';
    assert('LS has data before reset', win.localStorage.getItem(lsKey) !== null, true, true);

    const resetBtn = doc.getElementById('btn-reset');
    if (resetBtn) {
      /* 1st click: arm — must NOT reset yet */
      resetBtn.click();
      await new Promise(r => setTimeout(r, 50));
      assert('single click does NOT reset LS (guard)', win.localStorage.getItem(lsKey) !== null,
        win.localStorage.getItem(lsKey) !== null, true);
      assert('single click does NOT reset portfolio (guard)', s.portfolio === 99999, s.portfolio, 99999);
      assert('button gets .armed class after 1st click', resetBtn.classList.contains('armed'), true, true);

      /* 2nd click: confirm — now it resets */
      resetBtn.click();
      await new Promise(r => setTimeout(r, 50));
      assert('LS key removed after 2nd click', win.localStorage.getItem(lsKey) === null,
        win.localStorage.getItem(lsKey), null);
      assert('portfolio returns to default (50000) after 2nd click', s.portfolio === 50000, s.portfolio, 50000);
      assert('button disarms after reset (.armed removed)', !resetBtn.classList.contains('armed'), true, true);
    } else {
      fail++;
      out.innerHTML += `<span class="fail">❌</span>  Reset button (#btn-reset) not found in DOM\n`;
    }
  } catch(e) { fail++; out.innerHTML += `<span class="fail">❌</span>  [section threw] reset button: ${e.message}\n`; }

  /* cleanup */
  safeClearLS();

  } catch (e) {
    fail++;
    out.innerHTML += `<span class="fail">❌</span>  [integration aborted] ${e.message}\n`;
  } finally {
    clearTimeout(_watchdog);
    renderSummary();
  }
})();
</script>
</body>
</html>
